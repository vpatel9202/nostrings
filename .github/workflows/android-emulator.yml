name: android-emulator
# The Android smoke tests (one session and two at once) on x86_64 emulators,
# on Linux runners with KVM. Runs by
# hand for now.
on:
  # By hand until the known emulator failures are fixed (bead: smoke --android
  # fails on API 35 and 37); then on pull requests that touch Android code.
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Informational until the known emulator failures are fixed (web typing of
    # non-ASCII text, phone-screen launches on API 35): see docs/testing.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the Android server and test apps (pinned SDK)
        env:
          ANDROID_PLATFORM: android-37.0
          ANDROID_BUILD_TOOLS: 36.0.0
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" >/dev/null
          sh native/android/build.sh
      - run: npm ci
      - name: Smoke on the API ${{ matrix.api }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb -s emulator-5554 shell input keyevent 82 || true
            node bin/nostrings.mjs smoke --android --serial emulator-5554; one=$?; node bin/nostrings.mjs smoke --android --sessions 2 --serial emulator-5554; two=$?; exit $((one | two))
